<title>遠東經緯島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：全幅 3D 群島為底，四角浮貼資訊卡；中央經緯廣場的「布」隨會診進度織成 */
:root{
  --sky:#e9eef2; --sky2:#d7e2ea; --paper:#fbfaf7; --ink:#1d2a36; --muted:#5d6b78; --line:#d3dbe2;
  --navy:#16324f; --accent:#1b8fb0;
  --grass:#a9c29a; --rock:#8a7560; --plaza:#e6dccb;
  --c-proc:#2a9d8f; --c-fin:#d08c1f; --c-acct:#4f8a3c; --c-intl:#2f6fb5; --c-aud:#c2475b; --c-jaud:#7a55b0;
  --ok:#2f8a4f; --warn:#c48a12; --bad:#c2475b;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --fs:14px; --shadow:0 6px 24px rgba(22,50,79,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0f1a26; --sky2:#162638; --paper:#17222e; --ink:#e6edf3; --muted:#9aabba; --line:#2a3a4b;
  --navy:#9cc7e6; --accent:#4fb8d6; --grass:#5f7a58; --rock:#5a4a3c; --plaza:#6c6455;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0f1a26; --sky2:#162638; --paper:#17222e; --ink:#e6edf3; --muted:#9aabba; --line:#2a3a4b;
  --navy:#9cc7e6; --accent:#4fb8d6; --grass:#5f7a58; --rock:#5a4a3c; --plaza:#6c6455;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);overflow:hidden}
html.present{--fs:17px}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;
  display:flex;gap:7px;align-items:center;white-space:nowrap;box-shadow:var(--shadow);font-size:calc(var(--fs) - 1px);transition:opacity .3s, outline-color .3s;outline:2px solid transparent}
.lbl b{font-family:var(--f-display);font-weight:700;font-size:calc(var(--fs) + 1px)}
.lbl span{color:var(--muted);font-size:calc(var(--fs) - 2px)}
.lbl i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.lbl.lit{outline-color:currentColor}
.lbl.dim{opacity:.45}
.lbl .badge{font-style:normal;font-size:11px;color:#fff;border-radius:999px;padding:1px 7px}
.lbl:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{position:fixed;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.brand{top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:12px 16px;max-width:340px}
.brand h1{margin:0;font-family:var(--f-display);font-size:calc(var(--fs) + 12px);letter-spacing:.06em;color:var(--navy);text-wrap:balance}
.brand .sub{color:var(--muted);margin-top:2px;font-size:calc(var(--fs) - 1px)}
.entries{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.entries .k{font-size:12px;color:var(--muted);letter-spacing:.08em}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);background:transparent}
.chip.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.chip.soon::after{content:"・即將開放";opacity:.7}
.sim{top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:8px 14px;font-size:12px;color:var(--muted);max-width:280px;line-height:1.5}
.sim strong{color:var(--warn);letter-spacing:.06em}

.toolbar{bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
.toolbar button{font:inherit;font-size:calc(var(--fs) - 1px);border:0;background:transparent;color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.toolbar button:hover{background:var(--sky2)}
.toolbar button.on{background:var(--navy);color:var(--paper)}
.toolbar button.cta{background:var(--accent);color:#fff;font-weight:700}
.toolbar button.cta:hover{filter:brightness(1.07)}

#detail{top:96px;right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:calc(100% - 190px);overflow:auto;padding:18px 20px}
#detail h2{margin:0;font-family:var(--f-display);font-size:calc(var(--fs) + 9px)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.rep{font-size:12px;color:var(--muted);margin-top:4px}
#detail h3{font-size:calc(var(--fs) - 1px);margin:18px 0 8px;letter-spacing:.08em;color:var(--muted);font-weight:500}
#detail ul{margin:0;padding-left:18px;line-height:1.7}
.rule{border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:52px 1fr;gap:4px 10px}
.rule code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);padding-top:2px}
.rule .t{font-weight:700}
.rule .q{grid-column:2;color:var(--muted);line-height:1.6;font-size:calc(var(--fs) - 1px)}
.tag{font-size:11px;border-radius:4px;padding:0 6px;margin-left:6px;border:1px solid var(--line);color:var(--muted);font-weight:400}
.tag.adv{border-color:var(--bad);color:var(--bad)}
.links span{display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.src{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
.close{position:sticky;top:0;float:right;border:0;background:var(--sky2);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}

#story{left:max(16px,env(safe-area-inset-left,0px));bottom:84px;width:min(460px,calc(100vw - 32px));padding:16px 18px;max-height:calc(100% - 200px);overflow:auto}
#story.min .body{display:none}
#story.min{padding:10px 16px}
#story .step{font-size:12px;letter-spacing:.1em;color:var(--muted)}
#story h2{margin:4px 0 8px;font-family:var(--f-display);font-size:calc(var(--fs) + 6px);text-wrap:balance}
#story p,#story li{line-height:1.75}
#story ul{padding-left:18px;margin:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags span{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sky2)}
.casegrid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0;font-variant-numeric:tabular-nums}
.casegrid dt{color:var(--muted)}
.casegrid dd{margin:0}
.light{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.nav{display:flex;align-items:center;gap:8px;margin-top:12px}
.nav button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px;border-radius:9px;cursor:pointer}
.nav button.primary{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--navy)}
.note{font-size:12px;color:var(--muted);margin-top:8px}

#list{position:fixed;inset:0;overflow:auto;background:var(--sky);padding-block:100px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#list .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
#list article{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-top:4px solid var(--c)}
#list h2{margin:0;font-family:var(--f-display);font-size:calc(var(--fs) + 5px)}
#list article ul{padding-left:18px;line-height:1.7;margin:6px 0}

#report{position:fixed;inset:0;display:grid;place-items:center;background:rgba(15,26,38,.35);padding:16px}
#report .sheet{background:var(--paper);border-radius:16px;max-width:880px;width:100%;max-height:90%;overflow:auto;padding:22px 24px;box-shadow:var(--shadow)}
#report h2{margin:0;font-family:var(--f-display);font-size:calc(var(--fs) + 10px)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
th{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.brand .logo{width:34px;height:34px;border-radius:6px;vertical-align:-6px;margin-right:8px}
.lbl img{width:20px;height:20px;border-radius:4px}
.lbl .lamp{width:12px;height:12px;border-radius:50%;background:var(--line);box-shadow:0 0 0 2px var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:6px 0 10px}
#auto{left:max(16px,env(safe-area-inset-left,0px));bottom:84px;width:min(480px,calc(100vw - 32px));padding:16px 18px;max-height:calc(100% - 200px);overflow:auto}
#auto.running{left:50%;transform:translateX(-50%);width:auto;max-width:calc(100vw - 32px);padding:10px 16px}
#auto.running .hide-run{display:none}
#auto.running .meter{margin:4px 0}
#auto.running #mStatus{margin:0}
#auto h2{margin:2px 0 6px;font-family:var(--f-display);font-size:calc(var(--fs) + 6px)}
.cases{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.cases button{font:inherit;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;flex:1 1 180px}
.cases button.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.cases small{display:block;color:var(--muted);margin-top:2px}
.meter{display:flex;gap:8px;align-items:center;margin:12px 0;font-variant-numeric:tabular-nums}
.meter i{width:22px;height:22px;border-radius:50%;background:var(--line);transition:background .35s, transform .35s}
.meter i.pop{transform:scale(1.15)}
.meter span{margin-left:6px;color:var(--muted)}
.res{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:start;margin-top:8px;line-height:1.6}
.res .dn{white-space:nowrap}
.verdict{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--sky2);font-weight:700}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.rate label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.rate input,.rate select{font:inherit;font-size:14px;color:var(--ink);background:var(--sky);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.rate .full{grid-column:1/-1}
.rate-out{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sky2);line-height:1.7;font-variant-numeric:tabular-nums}
.rate-out ul{margin:4px 0 0;padding-left:18px}
@media (max-width:720px){
  #auto{bottom:84px;max-height:52%}
  .sim{display:none}
  .brand{max-width:calc(100vw - 32px)}
  #detail{top:auto;bottom:84px;max-height:52%}
  #story{bottom:84px;max-height:48%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function quote(q){const cbm=q.L*q.W*q.H,r=RATES[q.origin],o={cbm,lines:[],hints:[],total:0};
  if(q.mode==='sea'){const rt=Math.max(cbm,q.kg/1000),over=q.W>2.35||q.H>2.69||q.L>12,fr=r.sea*rt*(over?1.35:1),port=900*rt;o.total=fr+port+3500;
    o.lines=[`海運運費 ${fmt(fr)}（${rt.toFixed(1)} 計費噸 × NT$${r.sea}${over?'，超規加成 35%':''}）`,`港雜費 ${fmt(port)}`,`報關費 ${fmt(3500)}`];
    if(over)o.hints.push('寬或高超出 40 呎高櫃內徑（約 2.35 × 2.69 m），需改用平板櫃或開頂櫃，並預留吊裝時間。')}
  else{const ch=Math.max(q.kg,cbm*167),fr=r.air*ch,term=6*ch;o.total=fr+term+3500;
    o.lines=[`空運運費 ${fmt(fr)}（計費重 ${Math.round(ch).toLocaleString('en-US')} kg × NT$${r.air}）`,`倉儲費 ${fmt(term)}`,`報關費 ${fmt(3500)}`];
    if(q.kg>10000||q.H>1.6)o.hints.push('重量或高度超出一般貨機艙位，空運可行性低，建議改海運。')}
  if(q.before==='yes'&&q.prev>0){const d=(o.total-q.prev)/q.prev*100;o.hints.push(`與前次實績 ${fmt(q.prev)} 相比 ${d>=0?'+':''}${d.toFixed(1)}%${Math.abs(d)>15?'，差異偏大，請確認尺寸或路線是否不同':''}。`)}
  if(q.before==='no')o.hints.push('首次進口此設備：比價前先確認稅則號列與關稅率。');
  o.hints.push('可評估是否適用國內未產製機器設備的關稅減免（需事先申請，示範提醒）。');
  return o}

/* fabric drawing: warp = 送件後被派案的部門，weft = 已回覆的部門 */
let warpIds=[],weftIds=[];
function drawFabric(){
  const n=24,cell=256/n;fctx.clearRect(0,0,256,256);
  fctx.fillStyle='rgba(255,255,255,.12)';fctx.fillRect(0,0,256,256);
  if(!warpIds.length){fctx.strokeStyle='rgba(120,120,120,.35)';for(let c=0;c<n;c++){fctx.beginPath();fctx.moveTo(c*cell+cell/2,0);fctx.lineTo(c*cell+cell/2,256);fctx.stroke()}ftex.needsUpdate=true;return}
  const rows=Math.round(n*weftIds.length/6);
  for(let c=0;c<n;c++){const wc=DM[warpIds[c%warpIds.length]].color;fctx.fillStyle=wc;fctx.fillRect(c*cell+cell*.3,0,cell*.4,256)}
  for(let r=0;r<rows;r++){const wc=DM[weftIds[r%weftIds.length]].color;for(let c=0;c<n;c++){if((r+c)%2===0){fctx.fillStyle=wc;fctx.fillRect(c*cell,256-(r+1)*cell+cell*.15,cell,cell*.7)}}}
  ftex.needsUpdate=true;
}

  <div class="nav"><button type="button" id="sPrev" ${si===0?'disabled':''}>上一步</button>${s.report?'<button type="button" id="sRep" class="primary">看會診單</button>':'<button type="button" id="sNext" class="primary">下一步</button>'}<button type="button" id="sMin">${story.classList.contains('min')?'展開說明':'收合說明'}</button><button type="button" id="sEnd">結束</button><div class="dots">${STEPS.map((_,i)=>`<i class="${i<=si?'on':''}"></i>`).join('')}</div></div>`;
  story.querySelector('#sPrev').onclick=()=>{si--;renderStep()};
  const n=story.querySelector('#sNext');if(n)n.onclick=()=>{si++;renderStep()};
  const rp=story.querySelector('#sRep');if(rp)rp.onclick=showReport;
  story.querySelector('#sEnd').onclick=closeStory;
  story.querySelector('#sMin').onclick=()=>{story.classList.toggle('min');renderStep()};
}
function startStory(){stopAuto();detail.hidden=true;storyOn=true;si=0;story.hidden=false;bStory.classList.add('on');renderStep()}
function closeStory(){storyOn=false;clearLamps();story.hidden=true;bStory.classList.remove('on');warpIds=[];weftIds=[];drawFabric();setLit([]);overview()}
const rep=document.getElementById('report');
function showReport(){const c={紅:'var(--bad)',黃:'var(--warn)',綠:'var(--ok)'};
  rep.querySelector('.sheet').innerHTML=`<div class="eyebrow">會診單｜模擬個案</div><h2>紡絲卷取機進口採購（虛構）</h2>
  <p style="color:var(--muted);margin:6px 0 0">JPY 120,000,000 ≈ NT$25,200,000（模擬匯率 0.21）｜首次交易代理商｜CIF 台中港｜30/60/10</p>
  <div class="tbl"><table><thead><tr><th>部門</th><th>燈號</th><th>重點意見</th><th>後續動作</th></tr></thead><tbody>
  ${REPORT.map(r=>`<tr><td><span class="light" style="background:${DM[r[0]].color}"></span>${DM[r[0]].name}</td><td>${c[r[1]]?`<span class="light" style="background:${c[r[1]]}"></span>`:''}${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="verdict">1 個紅燈：退回採購處，補齊原廠授權與報價確認後再送會診。</div>
  <p class="note">綠燈＝允許（可附建議）；黃燈＝無其他意見；紅燈＝嚴重紅旗。燈號與金額皆為模擬。</p>
  <div class="nav"><button type="button" class="primary" id="rClose">關閉</button></div>`;
  rep.hidden=false;rep.querySelector('#rClose').onclick=()=>rep.hidden=true}
rep.addEventListener('click',e=>{if(e.target===rep)rep.hidden=true});

/* list view */
const listEl=document.getElementById('list');
listEl.querySelector('.grid').innerHTML=DEPTS.map(d=>`<article style="--c:${d.color}"><div class="eyebrow">${d.name}・${d.role}</div><h2>${d.island}</h2><h3 class="eyebrow" style="margin-top:12px">服務</h3><ul>${d.services.map(s=>`<li>${s}</li>`).join('')}</ul><h3 class="eyebrow">檢核規則（示範）</h3><ul>${d.rules.map(r=>`<li><b>${r[0]} ${r[1]}</b>${r[3]==='進階'?' <span class="tag adv">進階</span>':''}<br><span style="color:var(--muted)">${r[2]}</span></li>`).join('')}</ul></article>`).join('');

/* toolbar */
const bAuto=document.getElementById('bAuto'),bOverview=document.getElementById('bOverview'),bList=document.getElementById('bList'),bPresent=document.getElementById('bPresent'),bStory=document.getElementById('bStory');
bOverview.onclick=()=>{listEl.hidden=true;bList.classList.remove('on');detail.hidden=true;if(storyOn)closeStory();if(autoOn)stopAuto();setLit([]);overview()};
bList.onclick=()=>{listEl.hidden=!listEl.hidden;bList.classList.toggle('on',!listEl.hidden);labelsEl.hidden=!listEl.hidden};
bPresent.onclick=()=>{const on=document.documentElement.classList.toggle('present');bPresent.classList.toggle('on',on);controls.autoRotate=!on&&!reduce&&!storyOn&&detail.hidden};
document.getElementById('bMode').onclick=()=>{illus=!illus;setMode()};
bAuto.onclick=()=>{listEl.hidden=true;labelsEl.hidden=false;bList.classList.remove('on');autoOn?stopAuto():openAuto()};
bStory.onclick=()=>{listEl.hidden=true;labelsEl.hidden=false;bList.classList.remove('on');storyOn?closeStory():startStory()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){rep.hidden=true}if(storyOn&&rep.hidden){if(e.key==='ArrowRight'&&si<STEPS.length-1){si++;renderStep()}if(e.key==='ArrowLeft'&&si>0){si--;renderStep()}}});

/* picking */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];controls.autoRotate=false});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
  const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables,false)[0];if(!hit)return;const id=hit.object.userData.dept;id==='plaza'?focusPlaza():openDept(id)});

/* loop */
function setShift(){const w=host.clientWidth,h=host.clientHeight;let x=0;
  if(w>720){if(!detail.hidden)x=(detail.offsetWidth+16)/2;else if(!story.hidden)x=-(story.offsetWidth+16)/2;else if(!auto.hidden&&!auto.classList.contains('running'))x=-(auto.offsetWidth+16)/2}
  if(x)camera.setViewOffset(w,h,x,0,w,h);else camera.clearViewOffset();camera.updateProjectionMatrix()}
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;setShift()}
new MutationObserver(setShift).observe(document.body,{subtree:true,attributes:true,attributeFilter:['hidden']});
addEventListener('resize',resize);resize();applyTheme();
const clock=new THREE.Clock();
function loop(){const t=clock.getElapsedTime(),dt=clock.getDelta();
  if(flyTo){const k=Math.min(1,(performance.now()-flyTo.t0)/flyTo.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(flyTo.fromP,flyTo.toP,e);controls.target.lerpVectors(flyTo.fromT,flyTo.toT,e);if(k>=1)flyTo=null}
  if(!reduce){DEPTS.forEach((d,i)=>{islands[d.id].position.y=islands[d.id].userData.base+Math.sin(t*.6+i)*.18});plaza.position.y=2.2+Math.sin(t*.5)*.12;clouds.forEach((c,i)=>{c.position.x+=Math.sin(t*.1+i)*.004})}
  if(!reduce){floaters.forEach(f=>{f.position.y=4.6+Math.sin(t*1.2+f.userData.bob)*.25});planes.forEach(p=>{const a=t*.35;p.position.set(Math.cos(a)*3.4,4.2+Math.sin(t*.8)*.2,Math.sin(a)*3.4);p.rotation.y=-a-Math.PI/2;p.rotation.z=.18})}else{planes.forEach(p=>p.position.set(0,4.2,3.4))}
  const sp=reduce?0:.0045;
  DEPTS.forEach(d=>{const th=threads[d.id];if(th.bead.visible){th.t=(th.t+sp*(d.id===active?2:1))%1;th.bead.position.copy(th.curve.getPoint(reduce?.5:th.t))}});
  lateral.forEach(l=>{if(l.th.bead.visible){l.th.t=(l.th.t+sp)%1;l.th.bead.position.copy(l.th.curve.getPoint(reduce?.5:l.th.t))}});
  controls.update();renderer.render(scene,camera);placeLabels();requestAnimationFrame(loop)}
loop();
</script>
